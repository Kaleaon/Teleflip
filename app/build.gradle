plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def rawApiId = localProperties.getProperty('TELEGRAM_API_ID') ?: System.getenv('TELEGRAM_API_ID') ?: "0"
def rawApiHash = localProperties.getProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: ""
if (rawApiHash.startsWith('"') && rawApiHash.endsWith('"') && rawApiHash.length() >= 2) {
    rawApiHash = rawApiHash.substring(1, rawApiHash.length() - 1)
}

android {
    namespace 'com.teleflip.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.teleflip.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "int", "APP_ID", "${rawApiId}"
        buildConfigField "String", "APP_HASH", "\"${rawApiHash}\""

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // TDLib native Android library and coroutine wrapper
    implementation 'io.github.tdlib-android:core:0.1.1'
    implementation 'io.github.tdlib-android:ktx:0.1.1'

    // Coil image loading library
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'io.coil-kt:coil-gif:2.6.0'

    // Unit testing framework
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
}
